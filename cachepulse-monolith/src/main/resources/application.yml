server:
  port: 8081

spring:
  profiles:
    default: local
  application:
    name: canal-cache-sync-mq

  datasource:
    # 默认连接本机；连接其他环境时用环境变量或项目根目录 application-local.yml 覆盖。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:demo_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 与 cache.load 的查库上限配套：两条通道合计 8，留出写接口和心跳的连接。
      maximum-pool-size: 10
      # 定期检查空闲连接，让失效连接尽早退出连接池。
      keepalive-time: 60000
      validation-timeout: 1000

  data:
    redis:
      # Redis 服务端建议开启：
      # lazyfree-lazy-user-del yes
      # 说明：
      # 1. 这是 Redis 自身的配置，不是 Spring Boot 客户端配置项
      # 2. 当前项目删除缓存统一使用 DEL
      # 3. 开启后，Redis 会按释放成本决定是否走 lazy free 路径，降低大 key 删除阻塞
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

canal:
  destination: example
  # 数据源代数。单主库连续 binlog 场景保持 0；主从切换、重建或 RESET MASTER 后递增并重启消费者。
  source-epoch: 0
  # CDC 心跳：每秒更新业务库心跳表的 rows 行，心跳经 binlog → Canal → Kafka 回到消费者。
  # 超过 stale-after-ms 未追上时查询绕过 Redis 直接读库，追上后自动恢复。需先执行 docs/migrations/20261119-cdc-heartbeat.sql。
  heartbeat:
    enabled: ${CDC_HEARTBEAT_ENABLED:true}
    table: cdc_heartbeat
    # 心跳行由 Canal 按 hash(库名) ^ hash(主键) 散到各分区；6 个分区时 24 行每个分区至少 3 行。
    # 未覆盖的分区见 /cache/freshness 的 uncoveredPartitions。
    rows: 24
    # 单实例消费全部分区：0..N-1 每个分区都收到心跳才算追上，否则该分区的积压发现不了。多实例部署设为 0。
    expected-partitions: ${canal.mq.kafka.partition-count}
    interval-ms: 1000
    stale-after-ms: 3000
  mq:
    kafka:
      servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
      topic: example
      group-id: canal-cache-sync-mq
      # 本实例启动的 Kafka consumer 线程数，通常不超过 Kafka topic 分区数。
      partition-count: 6
      # 分区路由在 Canal Server 侧配置，例如：
      # canal.mq.partitionsNum=6
      # canal.mq.partitionHash=demo_db\\..*:$pk$
      # 注意：
      # 1. 参与缓存同步的表建议都有主键，$pk$ 会自动使用表主键做 Hash 分区
      # 2. 如果某张表的 Redis key 不是由主键组成，要在通配规则前单独配置，如 demo_db.user_email:email,demo_db\\..*:$pk$
      batch-size: 500
      # 最多等待 50ms 获取可用数据,50ms中只要来了一条数据直接返回
      poll-timeout-ms: 50
      # true: 业务友好的 FlatMessage 模式；false: 精确的 Message/Entry 模式
      flat-message: false

# 查询侧保护，只影响查询读写 Redis 和查库的方式，不改变删缓存的处理。
cache:
  # 写入缓存时在过期时间上随机增加 0–N%，让同一批回填的缓存错开过期，避免同时失效后集中查库。
  ttl-jitter-percent: 10
  redis-breaker:
    # 查询读写 Redis 连续失败这么多次后熔断：open-ms 内不再访问 Redis，直接查库；期满放一个请求试探。
    # 单次失败也会让本次查询改为直接查库。Redis 卡住而不是拒绝连接时，熔断前的请求要等满 spring.data.redis.timeout。
    failure-threshold: 5
    open-ms: 5000
  load:
    # 同时查库的上限（同 key 合并等待的请求不占名额）。拿不到名额最多等 acquire-timeout-ms，仍没有就返回 503，
    # 不在连接池前排队：缓存大面积失效、心跳降级或 Redis 熔断时请求会集中查库。
    max-concurrency: 6
    acquire-timeout-ms: 200
    # 布隆过滤器判定一定不存在的主键走这条窄通道，不直接拒绝：CDC 延迟期间刚插入的行还没进过滤器。
    suspect-max-concurrency: 2
    suspect-acquire-timeout-ms: 0
  bloom:
    # 为 @AutoCache(bloomFilter = true) 的分组维护主键布隆过滤器：启动后从库里读出全部主键，之后由 CDC 新增补充。
    enabled: true
    # 每张表预计的主键数和误判率。超出后误判率上升，更多 id 走正常通道，不影响正确性。
    expected-insertions: 100000
    false-positive-rate: 0.01

platform:
  # Must match the Canal JVM timezone used to render TIMESTAMP binlog values.
  binlog-time-zone: ${CANAL_BINLOG_TIME_ZONE:Asia/Shanghai}
  # Off by default: existing cache-only deployments require no platform schema or extra datasource.
  enabled: ${PLATFORM_ENABLED:false}
  source-id: ${PLATFORM_SOURCE_ID:local-mysql-v1}
  database: ${MYSQL_DB:demo_db}
  group-id: platform-change-archive
  tables: [users, departments, inventory]
  targets:
    demo-webhook:
      url: http://localhost:8081/platform/demo/webhook
      timeout-ms: 5000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/cdc_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${PLATFORM_MYSQL_USER:${MYSQL_USER:root}}
    password: ${PLATFORM_MYSQL_PASSWORD:${spring.datasource.password}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
      keepalive-time: 60000
      validation-timeout: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.canalcache: INFO
    com.alibaba.otter.canal: INFO
